name: Build ARM64 GHCR Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: memory-pressure-arm64-image
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/supermanzjjhhhh/omniroute
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  build-image:
    name: Build and push runner-base (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Record runner resources
        run: |
          uname -a
          nproc
          free -h
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            OMNIROUTE_BUILD_WORKERS=1
            OMNIROUTE_BUILD_MEMORY_MB=6144
          cache-from: type=gha,scope=memory-pressure-arm64
          cache-to: type=gha,scope=memory-pressure-arm64,mode=min,ignore-error=true

      - name: Verify published manifest
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}"
          {
            echo "### ARM64 image"
            echo
            echo "- Image: \`${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Source: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Smoke-test published image
        env:
          CONTAINER_NAME: omniroute-image-smoke-${{ github.run_id }}
        run: |
          set -euo pipefail
          trap 'docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true' EXIT

          docker pull "${IMAGE_NAME}:${IMAGE_TAG}"
          docker run --detach --name "$CONTAINER_NAME" --publish 127.0.0.1::20128 \
            "${IMAGE_NAME}:${IMAGE_TAG}"

          port="$(docker port "$CONTAINER_NAME" 20128/tcp | sed -n 's/.*:\([0-9][0-9]*\)$/\1/p')"
          for attempt in $(seq 1 45); do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER_NAME")"
            if curl --fail --silent --show-error "http://127.0.0.1:${port}/healthz" >/dev/null \
              && [ "$health" = healthy ]; then
              exit 0
            fi
            sleep 2
          done

          docker logs "$CONTAINER_NAME"
          docker inspect "$CONTAINER_NAME"
          exit 1
