name: Build ARM64 GHCR Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: memory-pressure-arm64-image
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/supermanzjjhhhh/omniroute
  IMAGE_TAG: memory-pressure-a1cf20658

jobs:
  build-image:
    name: Build and push runner-base (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Record runner resources
        run: |
          uname -a
          nproc
          free -h
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            OMNIROUTE_BUILD_WORKERS=1
            OMNIROUTE_BUILD_MEMORY_MB=6144
          cache-from: type=gha,scope=memory-pressure-arm64
          cache-to: type=gha,scope=memory-pressure-arm64,mode=min,ignore-error=true

      - name: Verify published manifest
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}"
          {
            echo "### ARM64 image"
            echo
            echo "- Image: \`${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Source: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
